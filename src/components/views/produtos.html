<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Gerenciamento de Produtos</h1>

        <!-- Formulário de cadastro de produto -->
        <form id="produto-form">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <input type="text" class="form-control" id="descricao" required>
            </div>
            <div class="mb-3">
                <label for="preco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="preco" required>
            </div>
            <button type="submit" class="btn btn-primary">Adicionar Produto</button>
        </form>

        <!-- Lista de produtos -->
        <h2 class="mt-5">Lista de Produtos</h2>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="produtos-list">
                <!-- Lista de produtos será carregada aqui -->
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById("produto-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const descricao = document.getElementById("descricao").value;
            const preco = parseFloat(document.getElementById("preco").value);

            // Enviar o produto para o backend
            fetch('/produtos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, descricao, preco })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Produto adicionado:', data);
                carregarProdutos();
            })
            .catch(error => console.error('Erro ao adicionar produto:', error));

            // Limpar o formulário
            document.getElementById("produto-form").reset();
        });

        // Função para carregar produtos
        function carregarProdutos() {
            fetch('/produtos')
                .then(response => response.json())
                .then(produtos => {
                    const listaProdutos = document.getElementById("produtos-list");
                    listaProdutos.innerHTML = ''; // Limpar a lista

                    produtos.forEach(produto => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${produto.id}</td>
                            <td>${produto.nome}</td>
                            <td>${produto.descricao}</td>
                            <td>${produto.preco}</td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="removerProduto(${produto.id})">Remover</button>
                            </td>
                        `;
                        listaProdutos.appendChild(tr);
                    });
                });
        }

        // Função para remover produto
        function removerProduto(id) {
            fetch(`/produtos/${id}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(() => {
                    carregarProdutos();
                })
                .catch(error => console.error('Erro ao remover produto:', error));
        }

        // Carregar produtos quando a página carregar
        window.onload = carregarProdutos;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
